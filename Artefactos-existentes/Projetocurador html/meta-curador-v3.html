<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Meta-Curador V3 — As Funcionalidades como Dados</title>
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --ink: #1e2530; --muted: #627180; --line: #e2e7ec;
    --accent: #2f6df6; --accent-soft: #e9f0ff;
    --ok: #1f9d63; --ok-soft: #e6f4ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); padding: 30px; }
  
  .container { max-width: 1000px; margin: 0 auto; }
  header { margin-bottom: 25px; border-bottom: 2px solid var(--line); padding-bottom: 15px; }
  h1 { font-size: 22px; font-weight: 800; }
  .meta-tag { display: inline-block; background: var(--accent-soft); color: var(--accent); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-top: 5px; }

  /* MÓDULO VISUAL (LAYOUT) */
  .grid { display: grid; grid-template-columns: 250px 1fr; gap: 20px; margin-top: 20px; }
  .sidebar { background: var(--panel); padding: 20px; border-radius: 8px; border: 1px solid var(--line); height: fit-content; }
  .sidebar h2 { font-size: 14px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; letter-spacing: 0.5px; }
  .domain-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .domain-item:hover { background: #f0f2f5; color: var(--ink); }
  .domain-item.active { background: var(--accent); color: white; }

  .main-content { background: var(--panel); padding: 25px; border-radius: 8px; border: 1px solid var(--line); }
  
  /* Cartões de Projeto */
  .card-projeto { border: 1px solid var(--line); padding: 15px; border-radius: 6px; margin-bottom: 15px; background: var(--panel); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .card-title { font-size: 16px; font-weight: 700; color: var(--ink); }
  .status-badge { background: var(--ok-soft); color: var(--ok); padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
  .card-notes { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Meta-Curador V3</h1>
    <div class="meta-tag">Lente: Funcionalidades do Dashboard V3 mapeadas como Objetos</div>
  </header>

  <div class="grid">
    <div class="sidebar">
      <h2>Domínios Técnicos</h2>
      <div id="dominios-lista"></div>
    </div>

    <div class="main-content">
      <div id="projetos-lista"></div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   1. CAIXA DE DADOS (A Fonte da Verdade - SSOT)
   ========================================================================== */
const STATE = {
  activeDomain: "Todos",
  dominios: ["Core UI", "Data Architecture", "Navigation"],
  projetos: [
    { 
      id: 1, 
      nome: "Filtros partilhados", 
      dominio: "Core UI", 
      estado: "concluido", 
      notas: "Filtros são globais e aplicam-se em todas as vistas ao mesmo tempo. Filtras na Tabela -> o Grafo e as Atribuições também filtram." 
    },
    { 
      id: 2, 
      nome: "Hierarquia de domínios", 
      dominio: "Data Architecture", 
      estado: "concluido", 
      notas: "Substituição da lista plana por uma árvore com níveis. A app calcula automaticamente o domínio pai nível 1 e o pai imediato." 
    },
    { 
      id: 3, 
      nome: "Drill-down nas Atribuições", 
      dominio: "Navigation", 
      estado: "concluido", 
      notas: "Navegação na hierarquia de domínios nível a nível, como uma pasta de ficheiros, acompanhada por um breadcrumb de navegação." 
    },
    { 
      id: 4, 
      nome: "Migração automática V2 → V3", 
      dominio: "Data Architecture", 
      estado: "concluido", 
      notas: "Importação automática na primeira abertura do ecossistema, preservando todos os dados de curadoria anteriores." 
    }
  ]
};

/* ==========================================================================
   2. CAIXA DO MOTOR (A Lógica Algorítmica Agnóstica)
   ========================================================================== */
const Engine = {
  // Filtra os projetos com base no domínio selecionado
  getFilteredProjects: function(domainName) {
    if (domainName === "Todos") {
      return STATE.projetos;
    }
    return STATE.projetos.filter(p => p.dominio === domainName);
  },

  // Altera o domínio ativo no estado global
  setActiveDomain: function(domainName) {
    STATE.activeDomain = domainName;
  }
};

/* ==========================================================================
   3. CAIXA DO VIEWER (O Adaptador Visual / Renderizador)
   ========================================================================== */
const Viewer = {
  // Desenha a lista de domínios na barra lateral
  renderSidebar: function() {
    const container = document.getElementById("dominios-lista");
    let html = `<div class="domain-item ${STATE.activeDomain === 'Todos' ? 'active' : ''}" onclick="Actions.selectDomain('Todos')">Todos os Módulos</div>`;
    
    STATE.dominios.forEach(dom => {
      const isActive = STATE.activeDomain === dom;
      html += `<div class="domain-item ${isActive ? 'active' : ''}" onclick="Actions.selectDomain('${dom}')">${dom}</div>`;
    });
    
    container.innerHTML = html;
  },

  // Desenha os cartões de projeto no painel principal
  renderMainList: function() {
    const container = document.getElementById("projetos-lista");
    const listaFiltrada = Engine.getFilteredProjects(STATE.activeDomain);
    
    if (listaFiltrada.length === 0) {
      container.innerHTML = `<p style="color:var(--muted); font-size:13px;">Nenhuma funcionalidade neste domínio.</p>`;
      return;
    }

    let html = "";
    listaFiltrada.forEach(proj => {
      html += `
        <div class="card-projeto">
          <div class="card-header">
            <span class="card-title">${proj.nome}</span>
            <span class="status-badge">${proj.estado}</span>
          </div>
          <p class="card-notes">${proj.notas}</p>
        </div>
      `;
    });
    
    container.innerHTML = html;
  },

  // Função mestre que atualiza toda a interface
  refreshUI: function() {
    this.renderSidebar();
    this.renderMainList();
  }
};

/* ==========================================================================
   4. A LIGAÇÃO (As Ações de Interação que fecham o circuito)
   ========================================================================== */
const Actions = {
  selectDomain: function(domainName) {
    Engine.setActiveDomain(domainName); // 1. O motor altera o estado
    Viewer.refreshUI();                 // 2. O viewer redesenha a tela com a nova verdade
  }
};

// Inicialização da aplicação ao carregar a página
window.onload = function() {
  Viewer.refreshUI();
};
</script>

</body>
</html>
