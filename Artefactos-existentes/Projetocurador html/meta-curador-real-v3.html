<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Meta-Curador: O Teu Ecossistema Mapeado</title>
<style>
  :root {
    --bg: #f5f7fa; --panel: #ffffff; --ink: #1e2530; --muted: #627180; --line: #e2e7ec;
    --accent: #2f6df6; --accent-soft: #e9f0ff;
    --ok: #1f9d63; --ok-soft: #e6f4ea;
    --v3: #7a5af5; --v3-soft: #ede9ff;
    --v4: #d98b00; --v4-soft: #fff3e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); padding: 30px; }
  
  .container { max-width: 1000px; margin: 0 auto; }
  header { margin-bottom: 25px; border-bottom: 2px solid var(--line); padding-bottom: 15px; }
  h1 { font-size: 22px; font-weight: 800; }
  .meta-tag { display: inline-block; background: var(--accent-soft); color: var(--accent); padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-top: 5px; }

  /* MÓDULO VISUAL (LAYOUT) */
  .grid { display: grid; grid-template-columns: 260px 1fr; gap: 20px; margin-top: 20px; }
  .sidebar { background: var(--panel); padding: 20px; border-radius: 8px; border: 1px solid var(--line); height: fit-content; }
  .sidebar h2 { font-size: 14px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; letter-spacing: 0.5px; }
  .domain-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 5px; transition: 0.2s; }
  .domain-item:hover { background: #f0f2f5; color: var(--ink); }
  .domain-item.active { background: var(--accent); color: white; }

  .main-content { background: var(--panel); padding: 25px; border-radius: 8px; border: 1px solid var(--line); }
  
  /* Cartões de Projeto */
  .card-projeto { border: 1px solid var(--line); padding: 15px; border-radius: 6px; margin-bottom: 15px; background: var(--panel); }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .card-title { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .status-badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
  .bg-core { background: var(--ok-soft); color: var(--ok); }
  .bg-v3 { background: var(--v3-soft); color: var(--v3); }
  .bg-v4 { background: var(--v4-soft); color: var(--v4); }
  
  .card-notes { color: var(--muted); font-size: 13px; line-height: 1.5; }
  code { font-family: monospace; background: #f0f2f6; padding: 2px 4px; border-radius: 4px; font-size: 12px; color: #d63384; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Meta-Curador: O Teu Ecossistema</h1>
    <div class="meta-tag">Dados reais extraídos dos Dashboards V3 e Código</div>
  </header>

  <div class="grid">
    <div class="sidebar">
      <h2>Domínios Técnicos</h2>
      <div id="dominios-lista"></div>
    </div>
    <div class="main-content">
      <div id="projetos-lista"></div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   1. CAIXA DE DADOS (SSOT com os dados reais dos teus ficheiros)
   ========================================================================== */
const STATE = {
  activeDomain: "Todos",
  dominios: [
    "Arquitetura (As 3 Caixas)", 
    "Vistas da Interface", 
    "Novidades V3", 
    "Evolução V4"
  ],
  projetos: [
    // --- Domínio: Arquitetura ---
    { 
      id: 1, nome: "Módulo de Dados (STATE)", dominio: "Arquitetura (As 3 Caixas)", estado: "Core", classe: "bg-core",
      notas: "Onde vive a verdade. Inclui os arrays <code>projetos[]</code> (os 44 projetos de seed), <code>links[]</code> e a <code>domainTree</code>. Guardado no <code>localStorage</code>." 
    },
    { 
      id: 2, nome: "Módulo Motor (Lógica)", dominio: "Arquitetura (As 3 Caixas)", estado: "Core", classe: "bg-core",
      notas: "As funções que calculam mas não desenham. Inclui <code>passesFilter(p)</code>, <code>domWouldCycle()</code> para anti-ciclo, e <code>computeGroups()</code>." 
    },
    { 
      id: 3, nome: "Módulo Viewer (Render)", dominio: "Arquitetura (As 3 Caixas)", estado: "Core", classe: "bg-core",
      notas: "O mestre de cerimónias <code>renderAll()</code> e os seus dependentes (<code>renderBody</code>, <code>renderGraph</code>). Reconstrói o DOM do zero." 
    },
    { 
      id: 4, nome: "Sistema de Import/Export", dominio: "Arquitetura (As 3 Caixas)", estado: "Core", classe: "bg-core",
      notas: "Permite descarregar o STATE em JSON, XLSX (via SheetJS embutido), CSV e Markdown." 
    },

    // --- Domínio: Vistas da Interface ---
    { 
      id: 5, nome: "Aba: Tabela Principal", dominio: "Vistas da Interface", estado: "Core", classe: "bg-core",
      notas: "Grelha editável de 19 colunas. Algumas são 'factos' (só leitura, ex: origem, stack), outras são 'curadoria' (editáveis, ex: estado, prioridade)." 
    },
    { 
      id: 6, nome: "Aba: Ligações (Grafo)", dominio: "Vistas da Interface", estado: "Core", classe: "bg-core",
      notas: "Grafo SVG com modos 'Força' (física livre) e 'Mind Map' (hierárquico). Permite ligar nós com tipos de relação como <code>alimenta</code> ou <code>depende-de</code>." 
    },
    { 
      id: 7, nome: "Aba: Cronologia & Genealogia", dominio: "Vistas da Interface", estado: "Core", classe: "bg-core",
      notas: "Mostra projetos ordenados por data (AAAA-MM) e uma árvore de evolução baseada no campo <code>nasceuDe</code>." 
    },
    { 
      id: 8, nome: "Aba: Atribuições", dominio: "Vistas da Interface", estado: "Core", classe: "bg-core",
      notas: "Interface tátil (Drag-and-Drop) para gerir campos categóricos em massa (ex: arrastar projetos para domínios ou estados)." 
    },

    // --- Domínio: Novidades V3 ---
    { 
      id: 9, nome: "Filtros Partilhados Globais", dominio: "Novidades V3", estado: "V3", classe: "bg-v3",
      notas: "Filtros de pesquisa que afetam simultaneamente a Tabela, o Grafo e as Atribuições, centralizados no <code>UI.filters</code>." 
    },
    { 
      id: 10, nome: "Hierarquia de Domínios", dominio: "Novidades V3", estado: "V3", classe: "bg-v3",
      notas: "Os domínios passaram de lista plana a árvore. A app agora calcula automaticamente o <code>projDomPai1</code> (raiz) e o pai imediato." 
    },
    { 
      id: 11, nome: "Drill-down nas Atribuições", dominio: "Novidades V3", estado: "V3", classe: "bg-v3",
      notas: "Navegação em pastas nível a nível na aba de Atribuições, acompanhada de um breadcrumb interativo." 
    },

    // --- Domínio: Evolução V4 ---
    { 
      id: 12, nome: "CrossLinks (dom↔dom)", dominio: "Evolução V4", estado: "V4", classe: "bg-v4",
      notas: "Nova estrutura no JSON que permite ligar domínios a domínios ou domínios a projetos, não apenas projeto a projeto." 
    },
    { 
      id: 13, nome: "Mind Map nas Atribuições", dominio: "Evolução V4", estado: "V4", classe: "bg-v4",
      notas: "Nova função <code>renderAsgMindmap()</code> que gera um SVG interativo para visualizar a árvore de domínios diretamente na aba." 
    },
    { 
      id: 14, nome: "Ferramenta de 2 Zonas (L/R)", dominio: "Evolução V4", estado: "V4", classe: "bg-v4",
      notas: "Função <code>renderLinkZones()</code> permite abrir dois painéis laterais (Esq/Dir) e criar relações taticamente com setas de direção." 
    }
  ]
};

/* ==========================================================================
   2. CAIXA DO MOTOR (Lógica Pura)
   ========================================================================== */
const Engine = {
  getFilteredProjects: function(domainName) {
    if (domainName === "Todos") return STATE.projetos;
    return STATE.projetos.filter(p => p.dominio === domainName);
  },
  setActiveDomain: function(domainName) {
    STATE.activeDomain = domainName;
  }
};

/* ==========================================================================
   3. CAIXA DO VIEWER (Renderização)
   ========================================================================== */
const Viewer = {
  renderSidebar: function() {
    const container = document.getElementById("dominios-lista");
    let html = `<div class="domain-item ${STATE.activeDomain === 'Todos' ? 'active' : ''}" onclick="Actions.selectDomain('Todos')">Visão Geral (Tudo)</div>`;
    
    STATE.dominios.forEach(dom => {
      const isActive = STATE.activeDomain === dom;
      html += `<div class="domain-item ${isActive ? 'active' : ''}" onclick="Actions.selectDomain('${dom}')">${dom}</div>`;
    });
    container.innerHTML = html;
  },

  renderMainList: function() {
    const container = document.getElementById("projetos-lista");
    const listaFiltrada = Engine.getFilteredProjects(STATE.activeDomain);
    
    let html = "";
    listaFiltrada.forEach(proj => {
      html += `
        <div class="card-projeto">
          <div class="card-header">
            <span class="card-title">${proj.nome}</span>
            <span class="status-badge ${proj.classe}">${proj.estado}</span>
          </div>
          <p class="card-notes">${proj.notas}</p>
        </div>
      `;
    });
    container.innerHTML = html;
  },

  refreshUI: function() {
    this.renderSidebar();
    this.renderMainList();
  }
};

/* ==========================================================================
   4. LIGAÇÃO (Eventos)
   ========================================================================== */
const Actions = {
  selectDomain: function(domainName) {
    Engine.setActiveDomain(domainName);
    Viewer.refreshUI();
  }
};

window.onload = function() {
  Viewer.refreshUI();
};
</script>

</body>
</html>
