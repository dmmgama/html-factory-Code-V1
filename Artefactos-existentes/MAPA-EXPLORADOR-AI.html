<html lang="pt">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas do Mundo AI — explorador</title>
<style>
  :root{
    --ink:#15120d; --ink2:#1d1810; --panel:#221c13; --line:#3a2f20;
    --parch:#ece3d2; --parch2:#c9bda4; --muted:#938672;
    --ochre:#cf9445; --terra:#c2622d; --teal:#4f9a92; --plum:#9a6c8e; --good:#7faa55; --bad:#cf5b4e;
    /* cores por ORIGEM (tipo) */
    --o-code:#5b9bd5; --o-cowork:#4f9a92; --o-dev:#7faa55; --o-web:#cf9445; --o-folder:#9b8a72;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:
      radial-gradient(circle at 12% 8%, #2a2116 0, transparent 45%),
      radial-gradient(circle at 88% 92%, #241c2a 0, transparent 40%),
      var(--ink);
    color:var(--parch);
    font:14px/1.55 "Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    display:flex;flex-direction:column;min-height:100vh;
    background-attachment:fixed;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:linear-gradient(rgba(207,148,69,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(207,148,69,.04) 1px,transparent 1px);
    background-size:30px 30px;}
  header{position:relative;z-index:2;padding:18px 26px 0;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1c1710,#15120d)}
  .titlerow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:25px;letter-spacing:.5px;font-weight:600}
  h1 .a{color:var(--ochre);font-style:italic}
  .sub{color:var(--parch2);font-size:12.5px;font-style:italic}
  .tabs{display:flex;gap:2px;margin-top:14px;flex-wrap:wrap}
  .tab{padding:9px 15px 8px;border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;
    background:#1a150e;color:var(--parch2);cursor:pointer;font-size:13px;letter-spacing:.3px;transition:.18s;position:relative;top:1px}
  .tab .n{font:10px "Cascadia Code","Consolas",monospace;color:var(--ochre);margin-right:6px}
  .tab:hover{color:var(--parch);background:#221b11}
  .tab.on{background:var(--panel);color:var(--parch);border-color:var(--ochre);top:0;box-shadow:0 -2px 0 var(--ochre) inset}
  main{position:relative;z-index:1;flex:1;overflow:auto;padding:20px 26px 60px}
  .view{display:none;animation:fade .35s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .vh{font-size:18px;margin:0 0 3px;color:var(--parch)}
  .vd{color:var(--parch2);font-size:12.5px;font-style:italic;margin:0 0 14px;max-width:760px}
  .vd b{color:var(--ochre);font-style:normal}
  /* tabelas */
  .tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#1a150ecc}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th{position:sticky;top:0;background:#241c12;color:var(--ochre);text-align:left;padding:9px 11px;
    cursor:pointer;user-select:none;white-space:nowrap;border-bottom:2px solid var(--line);font-weight:600;letter-spacing:.3px}
  th:hover{background:#2e2416}
  th .ar{opacity:.35;font-size:10px;margin-left:4px}
  th.sort .ar{opacity:1;color:var(--terra)}
  td{padding:7px 11px;border-bottom:1px solid #2a2114;vertical-align:top}
  tr:hover td{background:#20190f}
  td.mono,.mono{font:11.5px "Cascadia Code","Consolas",monospace;color:var(--parch2)}
  .pill{display:inline-block;font:10px "Cascadia Code",monospace;padding:1px 7px;border-radius:9px;border:1px solid currentColor;white-space:nowrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px;vertical-align:middle}
  .est-present{color:var(--good)} .est-alias{color:var(--ochre)} .est-missing{color:var(--muted)}
  .est-infra{color:var(--plum)} .est-broken{color:var(--bad)}
  .mv-safe{color:var(--good)} .mv-caution{color:var(--ochre)} .mv-na{color:var(--muted)}
  .k-confirmed{color:var(--good)} .k-plausible{color:var(--parch2)} .k-broken{color:var(--bad)}
  /* legenda origem */
  .leg{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 14px;font-size:11.5px;color:var(--parch2)}
  .leg span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:12px;height:12px;border-radius:3px;border:1px solid #0006}
  /* mindmap */
  #mm-wrap{position:relative}
  #mm{position:relative;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  svg.arrows{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:4}
  .grp{position:relative;z-index:1;background:#191309cc;border:1px solid var(--line);border-radius:13px;padding:9px 11px 12px;min-width:190px;max-width:300px}
  .grp>.gh{font-size:13px;color:var(--ochre);margin:0 0 9px;letter-spacing:.4px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{position:relative;font-size:11px;padding:4px 8px;border-radius:7px;cursor:pointer;
    border:1px solid #0006;border-left:4px solid;background:#241c12;color:var(--parch);transition:.15s;line-height:1.25}
  .chip:hover{transform:translateY(-1px);filter:brightness(1.15)}
  .chip .cn{font:9px "Cascadia Code",monospace;opacity:.6;margin-right:3px}
  .chip.dim{opacity:.2}
  .chip.hl{box-shadow:0 0 0 2px var(--ochre)}
  .mmctl{display:flex;gap:9px;align-items:center;margin:0 0 14px;flex-wrap:wrap;font-size:12px;color:var(--parch2)}
  .mmctl button{background:#241c12;color:var(--parch);border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;font-family:inherit;font-size:12px}
  .mmctl button:hover{border-color:var(--ochre)}
  .lline{width:22px;height:0;border-top:2px solid;display:inline-block;vertical-align:middle}
  /* painel detalhe (mm) */
  .pop{position:fixed;right:18px;bottom:18px;width:300px;background:var(--panel);border:1px solid var(--ochre);
    border-radius:12px;padding:14px 16px;box-shadow:0 12px 40px #000a;z-index:30;display:none}
  .pop.show{display:block}
  .pop h3{margin:0 0 3px;font-size:15px} .pop .x{position:absolute;top:8px;right:12px;cursor:pointer;color:var(--parch2)}
  .pop .kv{display:grid;grid-template-columns:74px 1fr;gap:2px 8px;font-size:12px;margin-top:8px}
  .pop .kv b{color:var(--parch2);font-weight:600}
  .count{color:var(--parch2);font-size:11.5px;font-style:italic}
  /* mindmap — layout c/ painel lateral */
  .mm-layout{display:flex;gap:16px;align-items:flex-start}
  .mm-side{flex:0 0 236px;align-self:stretch;background:#191309ee;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:12px;max-height:74vh;overflow:auto;position:sticky;top:0}
  .mm-side h4{margin:10px 0 5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ochre)}
  .mm-side h4:first-child{margin-top:0}
  .mm-side .row{display:flex;gap:6px;margin-bottom:6px}
  .mm-side .row button{flex:1;background:#241c12;color:var(--parch);border:1px solid var(--line);border-radius:6px;padding:5px;cursor:pointer;font-family:inherit;font-size:11px}
  .mm-side .row button:hover{border-color:var(--ochre)}
  .mm-side label{display:flex;align-items:center;gap:7px;padding:2px 4px;border-radius:5px;cursor:pointer;line-height:1.3}
  .mm-side label:hover{background:#241c12}
  .mm-side label input{accent-color:var(--ochre);flex:0 0 auto}
  .mm-side .gl{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--parch);margin-top:7px;border-top:1px solid #2a2114;padding-top:6px}
  .mm-side .gl .gc{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .mm-side .files{margin:1px 0 4px 16px;display:none}
  .mm-side .files.open{display:block}
  .mm-side .files label{font-size:11.5px;color:var(--parch2)}
  .mm-side .files .cn{font:9px "Cascadia Code",monospace;color:var(--ochre);opacity:.7}
  .mm-side .tw-tog{cursor:pointer;color:var(--parch2);margin-left:auto;font-size:11px}
  .mm-side .fl{font-size:10px;color:var(--parch2);margin:5px 0 1px;font-weight:600;letter-spacing:.3px}
  .mm-side .ffs{display:flex;flex-wrap:wrap;gap:1px 5px;margin-bottom:3px}
  .mm-side .ff{display:inline-flex;width:auto;gap:4px;font-size:11px;padding:1px 3px}
  .mm-canvas{flex:1;min-width:0}
  .grp.ghide{display:none}
  .chip.fhide{display:none}
</style>
</head>

function sortable(el,cols,rows,renders){
 const tw=document.createElement('div');tw.className='tw';
 const tb=document.createElement('table');
 const thead=document.createElement('thead');const trh=document.createElement('tr');
 cols.forEach((c,i)=>{const th=document.createElement('th');th.innerHTML=c+'<span class="ar">⇅</span>';
   th.onclick=()=>doSort(i);trh.appendChild(th);});
 thead.appendChild(trh);tb.appendChild(thead);
 const tbody=document.createElement('tbody');tb.appendChild(tbody);tw.appendChild(tb);el.appendChild(tw);
 let sc=-1,dir=1;
 function draw(){tbody.innerHTML="";rows.forEach(r=>{const tr=document.createElement('tr');
   r.forEach((cell,i)=>{const td=document.createElement('td');td.innerHTML=renders&&renders[i]?renders[i](cell,r):cell;tr.appendChild(td);});
   tbody.appendChild(tr);});
   trh.querySelectorAll('th').forEach((th,i)=>{th.classList.toggle('sort',i==sc);
     th.querySelector('.ar').textContent=i==sc?(dir>0?'▲':'▼'):'⇅';});}
 function doSort(i){if(sc==i)dir=-dir;else{sc=i;dir=1;}
   rows.sort((a,b)=>{let x=a[i],y=b[i];const nx=parseFloat(x),ny=parseFloat(y);
     if(!isNaN(nx)&&!isNaN(ny)&&(''+x).trim()!==''&&(''+y).trim()!==''){return (nx-ny)*dir;}
     return (''+x).localeCompare(''+y,'pt')*dir;});draw();}
 draw();
}
