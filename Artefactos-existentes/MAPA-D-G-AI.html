<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa D / G / AI — wiki-ai-evolution</title>
<style>
  :root {
    --d-color: #c0392b;
    --d-light: #fdf2f0;
    --d-border: #e8a89f;
    --d-highlight: #c0392b;
    --g-color: #1a5276;
    --g-light: #eaf2fb;
    --g-border: #8ab4d9;
    --g-highlight: #1a5276;
    --ai-color: #1e7e45;
    --ai-light: #eafaf1;
    --ai-border: #7dcea0;
    --ai-highlight: #1e7e45;
    --text: #1a1a1a;
    --text-muted: #555;
    --bg: #f5f5f3;
    --panel-bg: #ffffff;
    --border-radius: 4px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Cascadia Code', 'Fira Code', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.45;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    padding: 14px 20px 10px;
    background: #1a1a1a;
    color: #fff;
    display: flex;
    align-items: baseline;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 2px solid #333;
  }

  header h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  header .legend {
    font-size: 11.5px;
    color: #aaa;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  header .legend span {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  header .legend .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* MAIN LAYOUT */
  .main-wrapper {
    display: flex;
    height: calc(100vh - 47px);
    overflow: hidden;
  }

  .columns-area {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  /* SVG LAYER for connection lines */
  #connections-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
    overflow: visible;
  }

  .connection-line {
    stroke-width: 1.5;
    fill: none;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .connection-line.d-line { stroke: var(--d-color); }
  .connection-line.g-line { stroke: var(--g-color); }
  .connection-line.ai-line { stroke: var(--ai-color); }
  .connection-line.cross-line { stroke: #888; stroke-dasharray: 4 3; }

  .connection-line.visible { opacity: 0.6; }
  .connection-line.highlighted { opacity: 1; stroke-width: 2; }

  /* COLUMN STYLES */
  .column {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px 10px 40px;
    border-right: 1px solid #ddd;
    position: relative;
  }

  .column:last-child { border-right: none; }

  .column-header {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 8px 8px;
    margin-bottom: 8px;
    border-bottom: 2px solid;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .col-d .column-header { color: var(--d-color); border-color: var(--d-color); }
  .col-g .column-header { color: var(--g-color); border-color: var(--g-color); }
  .col-ai .column-header { color: var(--ai-color); border-color: var(--ai-color); }

  /* CARDS */
  .card {
    border: 1px solid;
    border-radius: var(--border-radius);
    margin-bottom: 6px;
    cursor: pointer;
    transition: box-shadow 0.15s, transform 0.1s;
    position: relative;
    background: white;
  }

  .card:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transform: translateY(-1px);
  }

  .card.active {
    box-shadow: 0 0 0 2px currentColor;
  }

  /* Compact cards */
  .card.compact {
    padding: 6px 8px;
  }

  /* Featured cards */
  .card.featured {
    padding: 8px 10px 10px;
    border-width: 2px;
  }

  /* Ghost cards (placeholders) */
  .card.ghost {
    opacity: 0.45;
    border-style: dashed;
    cursor: default;
    pointer-events: auto;
  }

  .card.ghost:hover {
    box-shadow: none;
    transform: none;
  }

  /* D column cards */
  .col-d .card {
    border-color: var(--d-border);
    color: var(--d-color);
  }
  .col-d .card:hover { border-color: var(--d-color); }
  .col-d .card .card-body { color: var(--text); }

  /* G column cards */
  .col-g .card {
    border-color: var(--g-border);
    color: var(--g-color);
  }
  .col-g .card:hover { border-color: var(--g-color); }
  .col-g .card .card-body { color: var(--text); }

  /* AI column cards */
  .col-ai .card {
    border-color: var(--ai-border);
    color: var(--ai-color);
  }
  .col-ai .card:hover { border-color: var(--ai-color); }
  .col-ai .card .card-body { color: var(--text); }

  .card-top {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 3px;
  }

  .card-id {
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }

  .pills {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
  }

  .pill {
    font-size: 9.5px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 10px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .pill.session {
    background: #eee;
    color: #555;
  }

  .pill.retrofit {
    background: #fff3cd;
    color: #856404;
    border: 1px solid #ffc107;
  }

  .pill.retrofit2 {
    background: #ffe0b2;
    color: #e65100;
    border: 1px solid #ff9800;
  }

  .pill.provisional {
    background: #e8eaf6;
    color: #3949ab;
    border: 1px solid #7986cb;
  }

  .pill.active-status {
    background: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #81c784;
  }

  .card-title {
    font-size: 12px;
    line-height: 1.35;
    color: var(--text);
  }

  .card.compact .card-title {
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .card.featured .card-title {
    font-size: 12.5px;
    font-weight: 500;
  }

  /* SIDE PANEL */
  .side-panel {
    width: 0;
    overflow: hidden;
    background: var(--panel-bg);
    border-left: 2px solid #ddd;
    transition: width 0.25s ease;
    flex-shrink: 0;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .side-panel.open {
    width: 400px;
    min-width: 300px;
    max-width: 45vw;
  }

  .panel-inner {
    padding: 16px;
    overflow-y: auto;
    flex: 1;
  }

  .panel-close {
    position: absolute;
    top: 10px;
    right: 12px;
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #888;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 3px;
  }

  .panel-close:hover { background: #f0f0f0; color: #333; }

  .panel-header {
    padding-right: 28px;
    margin-bottom: 12px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
  }

  .panel-id {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .panel-id.d-id { color: var(--d-color); }
  .panel-id.g-id { color: var(--g-color); }
  .panel-id.ai-id { color: var(--ai-color); }

  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .panel-pills {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .panel-body {
    font-size: 12.5px;
    line-height: 1.6;
    color: #333;
    margin-bottom: 14px;
  }

  .panel-body p {
    margin-bottom: 8px;
  }

  .panel-links {
    border-top: 1px solid #eee;
    padding-top: 10px;
  }

  .panel-links-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #888;
    margin-bottom: 6px;
  }

  .link-chips {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .link-chip {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid;
    cursor: pointer;
    transition: background 0.15s;
    font-weight: 600;
  }

  .link-chip.d-chip { color: var(--d-color); border-color: var(--d-border); }
  .link-chip.d-chip:hover { background: var(--d-light); }
  .link-chip.g-chip { color: var(--g-color); border-color: var(--g-border); }
  .link-chip.g-chip:hover { background: var(--g-light); }
  .link-chip.ai-chip { color: var(--ai-color); border-color: var(--ai-border); }
  .link-chip.ai-chip:hover { background: var(--ai-light); }

  /* Highlighted cards (when connections shown) */
  .card.conn-highlight {
    box-shadow: 0 0 0 2px currentColor;
  }

  /* Scrollbar styling */
  .column::-webkit-scrollbar { width: 4px; }
  .column::-webkit-scrollbar-track { background: transparent; }
  .column::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
  .column::-webkit-scrollbar-thumb:hover { background: #aaa; }

  .panel-inner::-webkit-scrollbar { width: 4px; }
  .panel-inner::-webkit-scrollbar-track { background: transparent; }
  .panel-inner::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

  @media (max-width: 900px) {
    .side-panel.open { width: 320px; }
  }
</style>
</head>

}
CONNECTIONS.forEach(c => addAdj(c.from, c.to));

// ============================================================
// RENDER
// ============================================================

let openCardId = null;

function getColType(id) {
  if (id.startsWith('D')) return 'd';
  if (id.startsWith('G')) return 'g';
  if (id.startsWith('A')) return 'ai';
  return '';
}

function buildPills(item) {
  let pills = '';
  if (item.ghost) return pills;

  if (item.retrofit2) {
    // Two pills for retrofit 2ª ordem
    pills += `<span class="pill session">s5</span>`;
    pills += `<span class="pill retrofit2">retrofit 2ª ordem s6</span>`;
  } else if (item.retrofit) {
    pills += `<span class="pill session">${item.session}</span>`;
    pills += `<span class="pill retrofit">retrofit</span>`;
  } else if (item.session) {
    pills += `<span class="pill session">${item.session}</span>`;
  }

  // Provisional status indicator
  const provisionalGs = ['G-014','G-015','G-016','G-017','G-018','G-019'];
  if (provisionalGs.includes(item.id)) {
    pills += `<span class="pill provisional">provisional</span>`;
  }

  return pills;
}

function renderCard(item, colType) {
  const featuredClass = item.featured ? 'featured' : 'compact';
  const ghostClass = item.ghost ? 'ghost' : '';
  const pills = buildPills(item);

  return `
    <div class="card ${featuredClass} ${ghostClass}"
         id="card-${item.id}"
         data-id="${item.id}"
         onclick="handleCardClick('${item.id}', ${item.ghost})">
      <div class="card-top">
        <span class="card-id">${item.id}</span>
        <div class="pills">${pills}</div>
      </div>
      <div class="card-title">${item.title}</div>
    </div>
  `;
}

function buildLinkChips(links) {
  if (!links || links.length === 0) return '';
  return links.map(l => {
    const t = getColType(l);
    return `<span class="link-chip ${t}-chip" onclick="navigateTo('${l}')">${l}</span>`;
  }).join('');
}

function openPanel(item) {
  const panel = document.getElementById('sidePanel');
  const inner = document.getElementById('panelInner');
  const colType = getColType(item.id);

  const allLinks = [...new Set([...(item.links || []), ...(adjMap[item.id] ? [...adjMap[item.id]] : [])])];

  const pills = buildPills(item);

  const linksHtml = allLinks.length > 0 ? `
    <div class="panel-links">
      <div class="panel-links-label">Ligações</div>
      <div class="link-chips">${buildLinkChips(allLinks)}</div>
    </div>
  ` : '';

  inner.innerHTML = `
    <div class="panel-header">
      <div class="panel-id ${colType}-id">${item.id}</div>
      <div class="panel-title">${item.title}</div>
      <div class="panel-pills">${pills}</div>
    </div>
    <div class="panel-body">${item.explanation || '<p>' + item.summary + '</p>'}</div>
    ${linksHtml}
  `;

  panel.classList.add('open');
}

function closePanel() {
  document.getElementById('sidePanel').classList.remove('open');
  if (openCardId) {
    const el = document.getElementById('card-' + openCardId);
    if (el) el.classList.remove('active');
  }
  clearHighlights();
  openCardId = null;
}

function handleCardClick(id, isGhost) {
  const allItems = [...D_ITEMS, ...G_ITEMS, ...AI_ITEMS];
  const item = allItems.find(i => i.id === id);
  if (!item) return;

  if (isGhost) {
    // Ghost: show minimal info
    const panel = document.getElementById('sidePanel');
    const inner = document.getElementById('panelInner');
    const colType = getColType(id);
    inner.innerHTML = `
      <div class="panel-header">
        <div class="panel-id ${colType}-id">${id}</div>
        <div class="panel-title" style="color:#888">${item.title}</div>
      </div>
      <div class="panel-body" style="color:#999">${item.summary}</div>
    `;
    panel.classList.add('open');
    return;
  }

  // Deselect previous
  if (openCardId && openCardId !== id) {
    const prev = document.getElementById('card-' + openCardId);
    if (prev) prev.classList.remove('active');
    clearHighlights();
  }

  if (openCardId === id) {
    closePanel();
    return;
  }

  openCardId = id;
  const el = document.getElementById('card-' + id);
  if (el) el.classList.add('active');

  openPanel(item);
  showConnections(id);

  // Scroll card into view
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function navigateTo(id) {
  handleCardClick(id, false);
  const el = document.getElementById('card-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ============================================================
// CONNECTION LINES
// ============================================================

function getCardCenter(id) {
  const el = document.getElementById('card-' + id);
  const area = document.getElementById('columnsArea');
  if (!el) return null;
  const elRect = el.getBoundingClientRect();
  const areaRect = area.getBoundingClientRect();
  return {
    x: elRect.left - areaRect.left + elRect.width / 2,
    y: elRect.top - areaRect.top + elRect.height / 2
  };
}

function getCardEdge(id, side) {
  const el = document.getElementById('card-' + id);
  const area = document.getElementById('columnsArea');
  if (!el) return null;
  const elRect = el.getBoundingClientRect();
  const areaRect = area.getBoundingClientRect();
  if (side === 'right') return { x: elRect.right - areaRect.left, y: elRect.top - areaRect.top + elRect.height / 2 };
  if (side === 'left') return { x: elRect.left - areaRect.left, y: elRect.top - areaRect.top + elRect.height / 2 };
  return { x: elRect.left - areaRect.left + elRect.width / 2, y: elRect.top - areaRect.top + elRect.height / 2 };
}

function colIndex(id) {
  if (id.startsWith('D')) return 0;
  if (id.startsWith('G')) return 1;
  return 2;
}

function clearHighlights() {
  const svg = document.getElementById('connections-svg');
  svg.innerHTML = '';
  document.querySelectorAll('.card.conn-highlight').forEach(el => el.classList.remove('conn-highlight'));
}

function showConnections(id) {
  clearHighlights();
  const connected = adjMap[id] ? [...adjMap[id]] : [];
  if (connected.length === 0) return;

  const svg = document.getElementById('connections-svg');
  const fromCol = colIndex(id);

  connected.forEach(toId => {
    const toCol = colIndex(toId);
    if (fromCol === toCol) return; // same column, skip line

    const fromSide = fromCol < toCol ? 'right' : 'left';
    const toSide = toCol > fromCol ? 'left' : 'right';

    const p1 = getCardEdge(id, fromSide);
    const p2 = getCardEdge(toId, toSide);
    if (!p1 || !p2) return;

    const cx1 = p1.x + (fromSide === 'right' ? 30 : -30);
    const cx2 = p2.x + (toSide === 'left' ? -30 : 30);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${p1.x},${p1.y} C${cx1},${p1.y} ${cx2},${p2.y} ${p2.x},${p2.y}`);

    const fromType = getColType(id);
    path.setAttribute('stroke', fromType === 'd' ? 'var(--d-color)' : fromType === 'g' ? 'var(--g-color)' : 'var(--ai-color)');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('opacity', '0.5');
    path.setAttribute('stroke-dasharray', '5 3');

    svg.appendChild(path);

    const toEl = document.getElementById('card-' + toId);
    if (toEl) toEl.classList.add('conn-highlight');
  });
}

// ============================================================
// INIT
// ============================================================

function init() {
  const colD = document.getElementById('col-d');
  const colG = document.getElementById('col-g');
  const colAI = document.getElementById('col-ai');

  D_ITEMS.forEach(item => {
    colD.insertAdjacentHTML('beforeend', renderCard(item, 'd'));
  });

  G_ITEMS.forEach(item => {
    colG.insertAdjacentHTML('beforeend', renderCard(item, 'g'));
  });

  AI_ITEMS.forEach(item => {
    colAI.insertAdjacentHTML('beforeend', renderCard(item, 'ai'));
  });

  document.getElementById('panelClose').addEventListener('click', closePanel);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
