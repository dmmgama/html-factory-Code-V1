    elements.push({ data: { source: 'c_fail', target: f.id, type: 'parent_link' } });
    f.gnnn_rel.forEach(gId => {
      elements.push({ data: { source: f.id, target: gId, type: 'mitigates' } });
    });
  });

  // CYTOSCAPE INIT
  const cy = cytoscape({
    container: document.getElementById('cy'),
    elements: elements,
    style: [
      {
        selector: 'node',
        style: {
          'label': 'data(label)',
          'text-valign': 'center',
          'text-halign': 'right',
          'text-margin-x': 10,
          'font-family': 'Inter',
          'font-size': '12px',
          'font-weight': 500,
          'background-color': '#999',
          'color': '#333',
          'width': 14,
          'height': 14,
          'text-wrap': 'wrap'
        }
      },
      {
        selector: 'node[type="root"]',
        style: { 
          'width': 30, 'height': 30, 
          'background-color': 'var(--color-root)', 
          'font-size': '14px', 'font-weight': 'bold',
          'text-valign': 'top', 'text-halign': 'center', 'text-margin-y': -10
        }
      },
      {
        selector: 'node[type="cluster"]',
        style: { 
          'width': 10, 'height': 10, 
          'background-color': 'var(--color-cluster)', 
          'color': '#888', 'font-size': '11px',
          'text-valign': 'bottom', 'text-halign': 'center', 'text-margin-y': 6
        }
      },
      {
        selector: 'node[type="file"]', 
        style: { 'background-color': 'var(--color-file)', 'shape': 'round-rectangle', 'width': 18, 'height': 18 }
      },
      {
        selector: 'node[type="D"]', 
        style: { 'background-color': 'var(--color-d)', 'shape': 'ellipse' }
      },
      {
        selector: 'node[type="G"]', 
        style: { 'background-color': 'var(--color-g)', 'shape': 'hexagon', 'width': 20, 'height': 20 }
      },
      {
        selector: 'node[type="AI"]', 
        style: { 'background-color': 'var(--color-ai)', 'shape': 'triangle', 'width': 18, 'height': 18 }
      },
      {
        selector: 'node[type="fail"]', 
        style: { 'background-color': 'var(--color-fail)', 'shape': 'diamond', 'width': 22, 'height': 22 }
      },
      {
        selector: 'edge',
        style: {
          'width': 1.5,
          'line-color': '#e3ddd0',
          'curve-style': 'bezier'
        }
      },
      {
        selector: 'edge[type="rel"], edge[type="affects"], edge[type="mitigates"]',
        style: {
          'line-color': '#c4bdab',
          'line-style': 'dashed',
          'target-arrow-shape': 'triangle',
          'target-arrow-color': '#c4bdab',
          'arrow-scale': 0.8
        }
      },
      {
        selector: 'edge[type="mitigates"]',
        style: {
          'line-color': 'var(--color-fail)',
          'target-arrow-color': 'var(--color-fail)',
          'line-style': 'dotted'
        }
      },
      {
        selector: '.dimmed',
        style: { 'opacity': 0.15 }
      },
      {
        selector: '.highlighted',
        style: { 'opacity': 1 }
      },
      {
        selector: 'node.highlighted',
        style: { 'border-width': 2, 'border-color': '#333' }
      },
      {
        selector: 'edge.highlighted',
        style: { 'line-color': '#555', 'target-arrow-color': '#555', 'width': 2 }
      }
    ],
    layout: {
      name: 'concentric',
      concentric: function(node) {
        if(node.data('type') === 'root') return 4;
        if(node.data('type') === 'cluster') return 3;
        return 1;
      },
      levelWidth: function(nodes) { return 1; },
      padding: 50,
      minNodeSpacing: 40
    }
  });

  // Global var para nav
  window.selectNode = function(id) {
    const node = cy.getElementById(id);
    if(node && node.length > 0) {
      cy.trigger('tap', {target: node});
      cy.zoom({ level: 1.2, position: node.position() });
      cy.center(node);
    }
  };

  // INTERACTIVITY
  cy.on('tap', 'node', function(evt){
    const node = evt.target;
    const type = node.data('type');
    if(type === 'root' || type === 'cluster') return;
    
    // Highlight
    cy.elements().addClass('dimmed').removeClass('highlighted');
    node.addClass('highlighted').removeClass('dimmed');
    
    // Highlight neighbors (1 degree)
    node.neighborhood().addClass('highlighted').removeClass('dimmed');
    
    // Panel Content
    renderPanel(node.data());
  });

  cy.on('tap', function(evt){
    if(evt.target === cy) {
      cy.elements().removeClass('dimmed').removeClass('highlighted');
      document.getElementById('panel').innerHTML = '<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:15px; color:#c4bdab;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg><br>Clique num nó no mapa para ver o detalhe operacional.</div>';
    }
  });

  // FILTER LOGIC
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const t = e.target;
      t.classList.toggle('active');
      const activeTypes = Array.from(document.querySelectorAll('.filter-btn.active')).map(b => b.dataset.filter);
      
      cy.nodes().forEach(n => {
        const ntype = n.data('type');
        if(['root', 'cluster'].includes(ntype)) return;
        if(activeTypes.includes(ntype)) {
          n.style('display', 'element');
        } else {
          n.style('display', 'none');
        }
      });
    });
  });

  function cl(id) {
    return `<a class="crosslink" onclick="window.selectNode('${id}')">${id}</a>`;
  }

  function renderPanel(data) {
    const p = document.getElementById('panel');
    const type = data.type;
    const raw = data.raw;
    
    let html = `<h2><code>${data.label}</code></h2>`;
    
    if (raw.status) {
      html += `<span class="badge ${raw.status}">${raw.status}</span>`;
    }
    
    if (raw.titulo) html += `<p style="margin-top:12px; font-weight:600; font-size:1.05rem;">${raw.titulo}</p>`;
    if (raw.descricao) html += `<div class="section"><p>${raw.descricao}</p></div>`;
    if (raw.fn) html += `<div class="section"><h3>Função</h3><p>${raw.fn}</p></div>`;

    html += `<div class="section"><h3>Detalhes Operacionais</h3>`;
    Object.keys(raw).forEach(k => {
      if(!['id', 'titulo', 'descricao', 'status', 'fn', 'gnnn_rel', 'd_rel', 'afecta', 'causa', 'deteccao', 'correccao'].includes(k)) {
        let val = raw[k];
        if (Array.isArray(val)) val = val.join(', ');
        html += `<div class="field"><strong>${k}</strong> <span>${val}</span></div>`;
      }
    });
    
    if(raw.d_rel && raw.d_rel.length > 0 && raw.d_rel[0] !== '—') {
        html += `<div class="field"><strong>D relacionada</strong> <span>${raw.d_rel.map(x => cl(x)).join(', ')}</span></div>`;
    }
    if(raw.gnnn && raw.gnnn !== '—' && !raw.gnnn.includes('pura') && !raw.gnnn.includes('consumida')) {
        const gs = raw.gnnn.split(', ').filter(x => x.startsWith('G-'));
        html += `<div class="field"><strong>G-NNN</strong> <span>${gs.map(x => cl(x)).join(', ')}</span></div>`;
    }
    if(raw.afecta && raw.afecta.length > 0) {
        html += `<div class="field"><strong>Afecta</strong> <span><code>${raw.afecta.join(', ')}</code></span></div>`;
    }

    html += `</div>`;
    
    // Diagramas
    if (type === 'G') {
      html += `<div class="diagram">
        <h3>Posição no Ledger</h3>
        <div class="timeline">`;
      for(let i=1; i<=16; i++) {
        const gid = 'G-' + String(i).padStart(3, '0');
        const h = (i % 5 === 0) ? '30px' : '20px';
        const hl = (gid === raw.id) ? 'highlight' : '';
        const hly = (gid === raw.id) ? '35px' : h;
        html += `<div class="timeline-tick ${hl}" style="height:${hly}" onclick="window.selectNode('${gid}')"><div class="tooltip">${gid}</div></div>`;
      }
      html += `</div></div>`;
    }
    
    if (type === 'D' && raw.id === 'D-016') {
      html += `<div class="diagram">
        <h3>Protocolo de Mutação (Fluxograma)</h3>
        <div class="flow">
          <div class="flow-step"><div class="num">1</div> <div><strong>Gatilho</strong> (proposta/incidente)</div></div>
          <div style="text-align:center; color:#c4bdab;">↓</div>
          <div class="flow-step"><div class="num">2</div> <div><strong>Proposta</strong></div></div>
          <div style="text-align:center; color:#c4bdab;">↓</div>
          <div class="flow-step"><div class="num">3</div> <div><strong>Validação</strong></div></div>
          <div style="text-align:center; color:#c4bdab;">↓</div>
          <div class="flow-step"><div class="num">4</div> <div><strong>Escrita no Ledger</strong></div></div>
          <div style="text-align:center; color:#c4bdab;">↓</div>
          <div class="flow-step"><div class="num">5</div> <div><strong>Verificação</strong> (Filesystem)</div></div>
          <div style="text-align:center; color:#c4bdab;">↓</div>
          <div class="flow-step"><div class="num">6</div> <div><strong>Aplicação</strong></div></div>
        </div>
      </div>`;
    }
    
    if (type === 'fail') {
      html += `<div class="diagram">
        <h3>Ciclo do Modo de Falha</h3>
        <div class="fail-schema">
          <div class="fail-box causa"><strong>Causa</strong>${raw.causa}</div>
          <div style="text-align:center; color:#c4bdab; font-size:1.2rem;">↓</div>
          <div class="fail-box deteccao"><strong>Detecção</strong>${raw.deteccao}</div>
          <div style="text-align:center; color:#c4bdab; font-size:1.2rem;">↓</div>
          <div class="fail-box correccao"><strong>Correcção</strong>${raw.correccao}</div>
        </div>
        <p style="margin-top:15px; font-size:0.85rem;"><strong>Mitigado por:</strong> ${raw.gnnn_rel.map(x => cl(x)).join(', ')}</p>
      </div>`;
    }
    
    p.innerHTML = html;
  }
</script>
</body>
</html>
